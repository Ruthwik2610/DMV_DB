steps:
  # ─────────────────────────────────────────────────────────────────────────────
  # Part 1: Build and Deploy the Secure Python MCP Server (BigQuery)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-mcp
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dmv-mcp-server', './mcp-servers']
    
  - name: 'gcr.io/cloud-builders/docker'
    id: push-mcp
    args: ['push', 'gcr.io/$PROJECT_ID/dmv-mcp-server']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-mcp
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dmv-mcp-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/dmv-mcp-server'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,MAX_BYTES_BILLED=$_MAX_BYTES_BILLED'

  # ─────────────────────────────────────────────────────────────────────────────
  # Part 2: Build and Deploy the Salesforce MCP Bridge
  # ─────────────────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-sf-bridge
    args: ['build', '-f', 'Dockerfile.sf-bridge', '-t', 'gcr.io/$PROJECT_ID/sf-mcp-bridge', '.']
    
  - name: 'gcr.io/cloud-builders/docker'
    id: push-sf-bridge
    args: ['push', 'gcr.io/$PROJECT_ID/sf-mcp-bridge']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-sf-bridge
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sf-mcp-bridge'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sf-mcp-bridge'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

  # ─────────────────────────────────────────────────────────────────────────────
  # Part 3: Build and Deploy the Full-Stack Node.js Application
  # ─────────────────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-app
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dmv-atlas-app', '.']
    
  - name: 'gcr.io/cloud-builders/docker'
    id: push-app
    args: ['push', 'gcr.io/$PROJECT_ID/dmv-atlas-app']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-app
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dmv-atlas-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/dmv-atlas-app'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'ALLOWED_ORIGIN=$_ALLOWED_ORIGIN,ALLOWED_ORIGIN_PROD=$_ALLOWED_ORIGIN_PROD,GROQ_API_KEY=$_GROQ_API_KEY,GROQ_MODEL=llama-3.3-70b-versatile,GEMINI_API_KEY=$_GEMINI_API_KEY,SF_CLIENT_ID=$_SF_CLIENT_ID,SF_CLIENT_SECRET=$_SF_CLIENT_SECRET,SF_REFRESH_TOKEN=$_SF_REFRESH_TOKEN,SF_INSTANCE_URL=$_SF_INSTANCE_URL,SF_MCP_URL=$_SF_MCP_URL,GITHUB_TOKEN=$_GITHUB_TOKEN,GITHUB_ORG=$_GITHUB_ORG,FIGMA_API_KEY=$_FIGMA_API_KEY,DEPLOY_VERCEL_TOKEN=$_DEPLOY_VERCEL_TOKEN,CLOUDFLARE_API_TOKEN=$_CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID=$_CLOUDFLARE_ACCOUNT_ID'

substitutions:
  _MAX_BYTES_BILLED: '100000000'
  _ALLOWED_ORIGIN: '*'
  _ALLOWED_ORIGIN_PROD: '*'
  _GROQ_API_KEY: 'required'
  _GEMINI_API_KEY: 'required'
  _SF_CLIENT_ID: 'required'
  _SF_CLIENT_SECRET: 'required'
  _SF_REFRESH_TOKEN: 'required'
  _SF_INSTANCE_URL: 'https://login.salesforce.com'
  _SF_MCP_URL: 'required'
  _GITHUB_TOKEN: 'required'
  _GITHUB_ORG: 'LLM-AI-INDIA'
  _FIGMA_API_KEY: 'required'
  _DEPLOY_VERCEL_TOKEN: 'required'
  _CLOUDFLARE_API_TOKEN: ''
  _CLOUDFLARE_ACCOUNT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/dmv-mcp-server'
  - 'gcr.io/$PROJECT_ID/sf-mcp-bridge'
  - 'gcr.io/$PROJECT_ID/dmv-atlas-app'
